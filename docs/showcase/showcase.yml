features_header:
  - Feature
  - What it does
features:
  - name: One hotkey from anywhere
    text: "`Win + Shift + T` by default, or any key with at least one of Ctrl, Alt, Shift, Win. Double-click the tray icon or use **Capture now** as well."
  - name: Drag a box on any screen
    text: "The overlay covers every monitor and is per-monitor DPI aware. It shows the box size in pixels; `Esc` cancels."
  - name: Windows OCR, on your PC
    text: "Uses `Windows.Media.Ocr`. The selection is read locally and nothing is uploaded."
  - name: Pick the OCR language
    text: "**Automatic** (your Windows profile languages) or any OCR language installed in Windows."
  - name: Small and huge selections
    text: "A selection is enlarged 2–3x before OCR (3x for short ones), within the size Windows OCR accepts; very large ones are scaled down to fit."
  - name: Checked clipboard
    text: "The text is written, read back and compared, with a few retries if another app holds the clipboard. Copied means it is really there."
  - name: Clear feedback
    text: "A toast shows the first words of what was copied, or says plainly that no text was found."
  - name: Quiet tray app
    text: "One copy per user session, optional start with Windows, Light / Dark / system theme, English and Turkish interface."

comparison:
  builtin: "PowerToys Text Extractor · Snipping Tool text actions (Windows 11)"
  intro: "Two Microsoft tools already read text from the screen, and both are good. WinTextCapture is a smaller, single-purpose alternative, not a replacement for either."
  rows:
    - topic: How you use it
      builtin: "**Text Extractor:** `Win + Shift + T` (default), drag a box, the text goes to the clipboard. **Snipping Tool:** take a snip, open **Text actions**, copy all or part of the text."
      tool: "`Win + Shift + T` (changeable), drag a box, the text goes to the clipboard."
    - topic: What you install
      builtin: "**Text Extractor:** PowerToys, a suite of many utilities. **Snipping Tool:** nothing, it comes with Windows 11."
      tool: "One portable exe that runs from the tray."
    - topic: Does differently
      builtin: "Text Extractor is part of a larger toolkit you may already use. The Snipping Tool keeps the screenshot, so you can also save, mark up or share it."
      tool: "Only this one job. A toast confirms what was copied after checking the clipboard."
    - topic: Pick it when
      builtin: "You already run PowerToys, or you want the image too, or you prefer not to add an app."
      tool: "You want just text capture, without the rest of PowerToys."
  outro: "PowerToys Text Extractor uses the same default hotkey. If you run both, change the shortcut in one of them (see [the FAQ](#questions-and-troubleshooting))."

